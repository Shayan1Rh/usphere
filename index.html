<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usphere – Çiftler için ilişki uygulaması</title>
  <meta name="description" content="Partnerini gerçekten ne kadar tanıyorsun? Çiftlere özel sorular, ortak anılar ve hedefler. Usphere'i App Store ve Google Play'den indir.">
  <meta property="og:title" content="Usphere – Çiftler için ilişki uygulaması">
  <meta property="og:description" content="Partnerini gerçekten ne kadar tanıyorsun? Çiftlere özel sorular, ortak anılar ve hedefler.">
  <meta property="og:image" content="https://shayan1rh.github.io/usphere/icon.png">
  <meta property="og:url" content="https://shayan1rh.github.io/usphere/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#201220">
  <link rel="icon" href="icon.png">
  <script>
    // Phones go straight to their store; everything else (desktop, unknown)
    // stays on this page and picks a store button below.
    (function () {
      var APP_STORE = "https://apps.apple.com/tr/app/usphere/id6803226970?l=tr";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.usphere.app";
      var ua = navigator.userAgent || "";
      // iPadOS reports itself as a Mac, so a Mac with a touch screen is an iPad.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) location.replace(APP_STORE);
      else if (isAndroid) location.replace(PLAY_STORE);
    })();
  </script>
  <style>
    :root { --bg: #201220; --card: rgba(255,255,255,0.06); --text: #fdf3ee; --muted: rgba(253,243,238,0.65); --accent: #e0416f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: radial-gradient(circle at 50% 20%, #3a1740 0%, var(--bg) 55%, #120912 100%); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { width: 100%; max-width: 380px; text-align: center; }
    img.icon { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 12px 40px rgba(224,65,111,0.35); }
    h1 { margin: 20px 0 8px; font-size: 28px; letter-spacing: -0.3px; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.5; font-size: 15px; }
    a.store { display: block; margin: 0 0 12px; padding: 14px 18px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px;
      color: var(--text); background: var(--card); border: 1px solid rgba(255,255,255,0.14); }
    a.store.primary { background: var(--accent); border-color: var(--accent); }
    a.store:hover { filter: brightness(1.1); }
    small { display: block; margin-top: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="Usphere">
    <h1>Usphere</h1>
    <p>Partnerini gerçekten ne kadar tanıyorsun? Çiftlere özel sorular, ortak anılar ve hedefler.</p>
    <a class="store primary" href="https://apps.apple.com/tr/app/usphere/id6803226970?l=tr">App Store'dan indir</a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.usphere.app">Google Play'den indir</a>
    <small>Telefonundan açtığında doğru mağazaya otomatik yönlendirilirsin.</small>
  </main>
</body>
</html>
